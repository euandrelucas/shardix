<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shardix-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <linearGradient id="facet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050810" stop-opacity="0" />
    </radialGradient>

    <filter id="hero-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Circle -->
  <circle cx="256" cy="256" r="230" fill="url(#bg-glow)" />

  <!-- Floating Crystal Nodes -->
  <circle cx="90" cy="110" r="6" fill="#38BDF8" opacity="0.7" />
  <circle cx="420" cy="90" r="8" fill="#C084FC" opacity="0.8" />
  <circle cx="440" cy="400" r="5" fill="#5865F2" opacity="0.6" />
  <circle cx="80" cy="380" r="7" fill="#06B6D4" opacity="0.75" />

  <line x1="90" y1="110" x2="138" y2="148" stroke="#38BDF8" stroke-width="2" opacity="0.3" stroke-dasharray="4 4" />
  <line x1="420" y1="90" x2="380" y2="138" stroke="#C084FC" stroke-width="2" opacity="0.3" stroke-dasharray="4 4" />

  <!-- Main emblem -->
  <g filter="url(#hero-glow)">
    <polygon points="256,32 440,138 440,350 256,456 72,350 72,138" fill="url(#facet-left)" opacity="0.25" />
    <polygon points="256,32 440,138 440,350 256,456 72,350 72,138" fill="none" stroke="url(#shardix-grad)" stroke-width="12" stroke-linejoin="round" />

    <polygon points="256,32 440,138 256,256" fill="url(#facet-right)" opacity="0.65" />
    <polygon points="440,138 440,350 256,256" fill="url(#facet-left)" opacity="0.85" />
    <polygon points="440,350 256,456 256,256" fill="url(#shardix-grad)" opacity="0.75" />
    <polygon points="256,456 72,350 256,256" fill="url(#facet-right)" opacity="0.85" />
    <polygon points="72,350 72,138 256,256" fill="url(#facet-left)" opacity="0.55" />
    <polygon points="72,138 256,32 256,256" fill="url(#shardix-grad)" opacity="0.95" />

    <line x1="256" y1="32" x2="256" y2="256" stroke="#A7F3D0" stroke-width="3" opacity="0.4" />
    <line x1="440" y1="138" x2="256" y2="256" stroke="#DDD6FE" stroke-width="3" opacity="0.4" />
    <line x1="72" y1="138" x2="256" y2="256" stroke="#38BDF8" stroke-width="3" opacity="0.5" />

    <path d="M280 64 L144 268 H256 L232 432 L368 228 H256 L280 64 Z" 
          fill="url(#glow-grad)" 
          stroke="#FFFFFF" 
          stroke-width="7" 
          stroke-linejoin="round" />
  </g>
</svg>
