<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Shardix Gradient -->
    <linearGradient id="shardix-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Facet 1 (Left Crystal) -->
    <linearGradient id="facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Facet 2 (Right Crystal) -->
    <linearGradient id="facet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#core-glow)">
    <!-- Outer Hexagon Shard Outline -->
    <polygon points="256,32 440,138 440,350 256,456 72,350 72,138" fill="url(#facet-left)" opacity="0.25" />
    
    <!-- Outer Border Lines -->
    <polygon points="256,32 440,138 440,350 256,456 72,350 72,138" fill="none" stroke="url(#shardix-grad)" stroke-width="12" stroke-linejoin="round" />

    <!-- Inner Geometric Crystal Facets -->
    <polygon points="256,32 440,138 256,256" fill="url(#facet-right)" opacity="0.6" />
    <polygon points="440,138 440,350 256,256" fill="url(#facet-left)" opacity="0.8" />
    <polygon points="440,350 256,456 256,256" fill="url(#shardix-grad)" opacity="0.7" />
    <polygon points="256,456 72,350 256,256" fill="url(#facet-right)" opacity="0.85" />
    <polygon points="72,350 72,138 256,256" fill="url(#facet-left)" opacity="0.5" />
    <polygon points="72,138 256,32 256,256" fill="url(#shardix-grad)" opacity="0.9" />

    <!-- Facet Inner Edge Highlights -->
    <line x1="256" y1="32" x2="256" y2="256" stroke="#A7F3D0" stroke-width="3" opacity="0.4" />
    <line x1="440" y1="138" x2="256" y2="256" stroke="#DDD6FE" stroke-width="3" opacity="0.4" />
    <line x1="72" y1="138" x2="256" y2="256" stroke="#38BDF8" stroke-width="3" opacity="0.5" />

    <!-- Central Lightning Bolt (Sharp Shard Emblem) -->
    <path d="M280 64 L144 268 H256 L232 432 L368 228 H256 L280 64 Z" 
          fill="url(#glow-grad)" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linejoin="round" />
  </g>
</svg>
